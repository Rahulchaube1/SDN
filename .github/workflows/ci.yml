name: SDN Network Guardian CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Unit & Integration Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify All 4 SDN Demonstration Scenarios
        run: |
          python -m network.scenarios.scenario_a_normal
          python -m network.scenarios.scenario_b_detection
          python -m network.scenarios.scenario_c_mitigation
          python -m network.scenarios.scenario_d_recovery

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build 7-Page React NOC Dashboard
        working-directory: ./frontend
        run: |
          npm install
          npm run build
