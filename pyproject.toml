[project]
name = "sdn-network-guardian"
version = "1.0.0"
description = "AI-Powered SDN Network Guardian: OpenFlow 1.3 Traffic Monitoring, Anomaly Detection, and Automated Threat Mitigation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.4.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
